services:
  api:
    build:
      context: ../../sample-app
      dockerfile: ../day1-docker/02-images/Dockerfile.basic
    ports:
      - "5000:5000"
    environment:
      - DEBUG=true
      - APP_VERSION=dev
    volumes:
      - ../../sample-app:/app
    command: python app.py
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    networks:
      - app-network

networks:
  app-network:
