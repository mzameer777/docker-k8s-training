apiVersion: v1
kind: Pod
metadata:
  name: task-api
  labels:
    app: task-api
    environment: workshop
spec:
  containers:
    - name: api
      image: python:3.12-slim
      command: ["python", "-m", "http.server", "8000"]
      ports:
        - containerPort: 8000
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "250m"
