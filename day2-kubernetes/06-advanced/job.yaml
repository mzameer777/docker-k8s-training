apiVersion: batch/v1
kind: Job
metadata:
  name: data-processor
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: processor
          image: alpine
          command: ["sh", "-c", "echo Processing batch $(date) && sleep 5 && echo Done!"]
