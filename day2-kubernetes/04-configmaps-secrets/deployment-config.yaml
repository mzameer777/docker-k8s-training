apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-configured
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-api-configured
  template:
    metadata:
      labels:
        app: task-api-configured
    spec:
      containers:
        - name: api
          image: alpine
          command: ["sh", "-c", "env | sort && sleep 3600"]
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: api-secrets-easy
